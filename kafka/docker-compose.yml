services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Добавляем задержку перед запуском, чтобы старые сессии в ZK успели истечь
      KAFKA_OPTS: "-Djava.net.preferIPv4Stack=true"

    # КЛЮЧЕВОЙ ФИКС: переопределяем команду запуска с sleep
    command: >
      sh -c "
        sleep 20 &&  # 20 секунд достаточно, чтобы ZK удалил старый /brokers/ids/1
        /etc/confluent/docker/run
      "

    healthcheck:
      # Проверяем внутренний listener, доступный гарантированно из контейнера
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s  # Даём больше времени на старт после sleep

    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
    name: pizza-kafka-network