version: "3"

dotenv: [".env"]

tasks:
  install-deps:
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2
      - go install github.com/pressly/goose/v3/cmd/goose@v3.14.0
      - go get google.golang.org/genproto/googleapis/type/date
      - go get google.golang.org/genproto/googleapis/type/money
    env:
      GOBIN: "{{.PWD}}/bin"

  generate:
    cmds:
      - task: generate-card-api

  generate-card-api:
    cmds:
      - mkdir -p pkg/card_v1
      - protoc --proto_path api --proto_path third_party/googleapis --go_out=pkg/card_v1 --go_opt=paths=source_relative --plugin=protoc-gen-go=bin/protoc-gen-go.exe --go-grpc_out=pkg/card_v1 --go-grpc_opt=paths=source_relative --plugin=protoc-gen-go-grpc=bin/protoc-gen-go-grpc.exe api/card-service_v1/card.proto

  migrate-up:
    cmds:
      - ./bin/goose.exe -dir {{.MIGRATION_DIR}} postgres "host=localhost port={{.PG_PORT}} dbname={{.PG_DATABASE_NAME}} user={{.PG_USER}} password={{.PG_PASSWORD}} sslmode=disable" up -v
